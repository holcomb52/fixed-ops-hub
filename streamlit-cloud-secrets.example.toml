# Paste this into Streamlit Cloud → App settings → Secrets
# Replace the placeholder values with your real Supabase credentials.

SUPABASE_URL = "https://YOUR_PROJECT.supabase.co"
SUPABASE_KEY = "your_service_role_key_here"

# Full Fixed Ops access (you / leadership)
APP_PASSWORD = "choose-a-strong-admin-password"

# Parts Manager — Parts tab + Parts Returns reports only
PARTS_MANAGER_PASSWORD = "choose-a-strong-parts-password"
PARTS_MANAGER_LABEL = "Parts Manager"

# Warranty Audit page only. Leave blank if you are not using that page.
# Must be a vision-capable model. Never commit a real key.
OPENAI_API_KEY = ""
OPENAI_MODEL = "gpt-4o"
